name: Winter Arc APK Builder

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: winter_arc_playstore_project
        run: npm install

      - name: Add Android
        working-directory: winter_arc_playstore_project
        run: npx cap add android

      - name: Sync Android
        working-directory: winter_arc_playstore_project
        run: npx cap sync android

      - name: Build APK
        working-directory: winter_arc_playstore_project/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winter-arc-apk
          path: winter_arc_playstore_project/android/app/build/outputs/apk/debug/app-debug.apk
