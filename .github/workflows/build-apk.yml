name: Winter Arc APK Builder

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Find project folder
        id: locate
        shell: bash
        run: |
          FILE=$(find . -type f -name package.json \
            -not -path '*/node_modules/*' -print -quit)
          if [ -z "$FILE" ]; then
            echo "ERROR: package.json not found"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project found in: $DIR"

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npm install

      - name: Add Android platform
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winter-arc-apk
          path: ${{ steps.locate.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
